# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.example.yml
#
# Three examples are shown below:
#   1. postgres  — minimal
#   2. postgres  — full (all optional params)
#   3. postgres-minio — combined backup
#
# Copy the relevant section into your own docker-compose.yml and adjust values.
# ─────────────────────────────────────────────────────────────────────────────

# ══════════════════════════════════════════════════════════════════════════════
# EXAMPLE 1 — PostgreSQL backup, minimal config
# ══════════════════════════════════════════════════════════════════════════════
services:

  backup:
    image: muqimjon/zaxira
    restart: always
    environment:
      # ── Database ────────────────────────────────
      PG_HOST: postgres
      PG_USER: myuser
      PG_PASSWORD: mypassword
      PG_DATABASE: mydb

      # ── Destination (rclone) ────────────────────
      RCLONE_REMOTE: gdrive          # rclone remote name
      RCLONE_PATH: backups/myapp     # path inside the remote

    volumes:
      - ./data/backup:/backup
      - ./rclone.conf:/etc/rclone/rclone.conf:ro

    depends_on:
      - postgres


# ══════════════════════════════════════════════════════════════════════════════
# EXAMPLE 2 — PostgreSQL backup, all options
# ══════════════════════════════════════════════════════════════════════════════

  backup-full:
    image: muqimjon/zaxira
    restart: always
    environment:
      # ── Project ─────────────────────────────────
      PROJECT_NAME: myapp            # prefix in backup filenames
      TZ: Asia/Tashkent

      # ── Database ────────────────────────────────
      PG_HOST: postgres
      PG_PORT: 5432                  # default: 5432
      PG_USER: myuser
      PG_PASSWORD: mypassword
      PG_DATABASE: mydb

      # ── Schedules (cron syntax) ──────────────────
      BACKUP_SCHEDULE: "0 2 * * *"  # daily at 02:00  (default)
      UPLOAD_SCHEDULE:  "0 */6 * * *" # retry upload every 6 h (optional)
      CLEANUP_SCHEDULE: "0 7 * * *" # cleanup daily at 07:00  (optional)
      # If UPLOAD_SCHEDULE is empty → upload runs right after each backup.
      # If CLEANUP_SCHEDULE is empty → cleanup runs right after each upload.

      # ── Local retention ─────────────────────────
      MIN_LOCAL_BACKUPS: 2           # keep at least N files locally
      MAX_LOCAL_BACKUPS: 5           # never exceed N files locally

      # ── Remote retention ────────────────────────
      MAX_REMOTE_BACKUPS: 30         # max files kept in cloud storage

      # ── Compression & encryption ────────────────
      COMPRESSION_LEVEL: 6          # zip level 1-9 (default: 6)
      BACKUP_PASSWORD: "str0ngP@ss" # optional AES-256 zip encryption

      # ── Alerts & monitoring (all optional) ──────
      NOTIFY_ON: failure                       # failure | always | never
      NOTIFY_TELEGRAM_TOKEN: "123456:ABC..."   # from @BotFather
      NOTIFY_TELEGRAM_CHAT_ID: "123456789"     # from @userinfobot
      # NOTIFY_WEBHOOK_URL: https://example.com/hook
      # HEARTBEAT_URL: https://hc-ping.com/your-uuid   # dead-man's-switch
      # Email (Gmail → use an App Password, not your login password)
      # SMTP_HOST: smtp.gmail.com
      # SMTP_PORT: 587
      # SMTP_USER: you@gmail.com
      # SMTP_PASS: app-password
      # EMAIL_FROM: you@gmail.com
      # EMAIL_TO: you@gmail.com, teammate@gmail.com

      # ── Rclone destination ──────────────────────
      RCLONE_REMOTE: gdrive
      RCLONE_PATH: backups/myapp
      RCLONE_CONFIG: /etc/rclone/rclone.conf

      # Alternative: paste rclone config directly as env var
      # RCLONE_CONFIG_CONTENT: |
      #   [gdrive]
      #   type = drive
      #   ...

    volumes:
      - ./data/backup:/backup
      - ./rclone.conf:/etc/rclone/rclone.conf:ro

    depends_on:
      - postgres


# ══════════════════════════════════════════════════════════════════════════════
# EXAMPLE 3 — PostgreSQL + MinIO combined backup (one consistent "project")
# ══════════════════════════════════════════════════════════════════════════════
#
# Both sources are backed up in ONE run with a SHARED timestamp, so the postgres
# and minio archives line up as a single point-in-time version (the DB path and
# the object it points to stay consistent). Two projects on one server → run two
# of these, each with its own PROJECT_NAME — they back up independently.
#
# Optional: add HUB_URL + HUB_TOKEN and this locally-configured project is pushed
# UP to the hub on first connect — it appears in the web UI ("Projects") and
# becomes hub-managed. Configure once here, manage from the hub.

  backup-combined:
    image: muqimjon/zaxira
    restart: always
    environment:
      PROJECT_NAME: myapp
      TZ: Asia/Tashkent

      # ── Optional: register this project into a hub on first connect ──
      # HUB_URL: https://hub.example.com
      # HUB_TOKEN: your-hub-token

      # ── PostgreSQL ──────────────────────────────
      PG_HOST: postgres
      PG_USER: myuser
      PG_PASSWORD: mypassword
      PG_DATABASE: mydb

      # ── MinIO (or any S3-compatible storage) ────
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: uploads
      # MINIO_API: S3v4               # default: S3v4

      # ── Schedules ───────────────────────────────
      BACKUP_SCHEDULE: "0 3 * * *"
      UPLOAD_SCHEDULE: "0 */4 * * *"

      # ── Retention (applied PER SOURCE, not combined) ──
      MIN_LOCAL_BACKUPS: 2           # keep ≥2 postgres AND ≥2 minio locally
      MAX_LOCAL_BACKUPS: 5           # keep ≤5 of each, paired by timestamp
      MAX_REMOTE_BACKUPS: 30         # keep ≤30 of each in the cloud

      # ── Rclone destination ──────────────────────
      RCLONE_REMOTE: gdrive
      RCLONE_PATH: backups/myapp

    volumes:
      - ./data/backup:/backup
      - ./rclone.conf:/etc/rclone/rclone.conf:ro

    depends_on:
      - postgres
      - minio
