name: release-please

# Conventional Commits → version bump. Merging to main opens/updates a release PR;
# merging that PR tags a release (vX.Y.Z), which triggers release.yml to build images.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
