name: release-please

# Conventional Commits → version bump. Runs only when triggered manually
# (Actions → release-please → Run workflow); opens/updates a release PR whose
# merge tags a release (vX.Y.Z), which triggers release.yml to build images.

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
