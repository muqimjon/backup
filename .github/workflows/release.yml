name: release

# Builds & pushes the zaxira agent + hub images on a release tag (created by
# release-please), multi-arch, tagged with the version and :latest.
# Manual runs: provide a version like 1.2.3.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 1.2.3)"
        required: true
        type: string

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            V="${{ github.event.release.tag_name }}"
          else
            V="${{ inputs.version }}"
          fi
          echo "version=${V#v}" >> "$GITHUB_OUTPUT"

  images:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { file: workers/images/agent/Dockerfile, repo: muqimjon/zaxira,     platforms: "linux/amd64,linux/arm64" }
          - { file: deploy/hub.Dockerfile,           repo: muqimjon/zaxira-hub, platforms: "linux/amd64,linux/arm64" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: tags
        env:
          VERSION: ${{ needs.version.outputs.version }}
          REPO: ${{ matrix.repo }}
        run: |
          {
            echo "tags<<EOF"
            echo "${REPO}:latest"
            echo "${REPO}:${VERSION}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          platforms: ${{ matrix.platforms }}
          tags: ${{ steps.tags.outputs.tags }}

  readme:
    needs: images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repository: [muqimjon/zaxira, muqimjon/zaxira-hub]
    steps:
      - uses: actions/checkout@v4
      - uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ matrix.repository }}
          readme-filepath: ./README.md
