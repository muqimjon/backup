name: release

# Builds & pushes every image on a release tag (created by release-please),
# multi-arch, tagged with the version and a moving alias (:latest / :<variant>).
# Manual runs: provide a version like 1.2.3.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 1.2.3)"
        required: true
        type: string

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            V="${{ github.event.release.tag_name }}"
          else
            V="${{ inputs.version }}"
          fi
          echo "version=${V#v}" >> "$GITHUB_OUTPUT"

  images:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { file: workers/images/postgres/Dockerfile,       repo: muqimjon/backup,          variant: postgres,       platforms: "linux/amd64,linux/arm64" }
          - { file: workers/images/mysql/Dockerfile,          repo: muqimjon/backup,          variant: mysql,          platforms: "linux/amd64,linux/arm64" }
          - { file: workers/images/minio/Dockerfile,          repo: muqimjon/backup,          variant: minio,          platforms: "linux/amd64,linux/arm64" }
          - { file: workers/images/postgres-minio/Dockerfile, repo: muqimjon/backup,          variant: postgres-minio, platforms: "linux/amd64,linux/arm64" }
          - { file: workers/images/mssql/Dockerfile,          repo: muqimjon/backup,          variant: mssql,          platforms: "linux/amd64" }
          - { file: workers/images/agent/Dockerfile,          repo: muqimjon/backuphub-agent, variant: "",             platforms: "linux/amd64,linux/arm64" }
          - { file: deploy/hub.Dockerfile,                    repo: muqimjon/backuphub,       variant: "",             platforms: "linux/amd64,linux/arm64" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: tags
        env:
          VERSION: ${{ needs.version.outputs.version }}
          REPO: ${{ matrix.repo }}
          VARIANT: ${{ matrix.variant }}
        run: |
          {
            echo "tags<<EOF"
            if [ -n "$VARIANT" ]; then
              echo "${REPO}:${VARIANT}"
              echo "${REPO}:${VARIANT}-${VERSION}"
            else
              echo "${REPO}:latest"
              echo "${REPO}:${VERSION}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          platforms: ${{ matrix.platforms }}
          tags: ${{ steps.tags.outputs.tags }}

  readme:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: muqimjon/backuphub
          readme-filepath: ./README.md
