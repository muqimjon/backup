services:
  hub:
    build:
      context: ..
      dockerfile: deploy/hub.Dockerfile
    image: muqimjon/backuphub:latest
    container_name: backuphub
    restart: always
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__Default: Data Source=/data/backuphub.db
      Jwt__Key: ${JWT_KEY}
      Admin__Username: ${ADMIN_USERNAME:-admin}
      Admin__Password: ${ADMIN_PASSWORD:-admin}
      Hub__Token: ${HUB_TOKEN}
      Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
      DataProtection__KeysPath: /data/keys
    volumes:
      - ./data:/data
    networks:
      - backuphub

  agent:
    build:
      context: ..
      dockerfile: workers/images/agent/Dockerfile
    image: muqimjon/backuphub-agent:latest
    container_name: backuphub_agent
    restart: always
    depends_on:
      - hub
    environment:
      HUB_URL: http://hub:8080
      HUB_TOKEN: ${HUB_TOKEN}
      AGENT_NAME: ${AGENT_NAME:-local-agent}
      PROJECT_NAME: ${PROJECT_NAME:-backuphub}
      TZ: ${TZ:-UTC}
    volumes:
      - ./agent-data:/backup
    networks:
      - backuphub

  prometheus:
    image: prom/prometheus:latest
    container_name: backuphub_prometheus
    restart: always
    profiles: [metrics]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - backuphub

  grafana:
    image: grafana/grafana:latest
    container_name: backuphub_grafana
    restart: always
    profiles: [metrics]
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    networks:
      - backuphub

volumes:
  prometheus-data:
  grafana-data:

networks:
  backuphub:
    driver: bridge
